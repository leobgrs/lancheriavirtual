<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff5e2c">
  <title>Painel Fila Virtual — Lancheria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============================================================
       DESIGN TOKENS — Sistema de design unificado
       ============================================================ */
    :root {
      /* Cores de marca */
      --primary: #ff5e2c;
      --primary-dark: #e04b1f;
      --primary-light: #ffb199;
      --primary-soft: rgba(255, 94, 44, 0.08);
      --primary-gradient: linear-gradient(135deg, #ff5e2c 0%, #ff2a5f 100%);
      --primary-gradient-soft: linear-gradient(135deg, rgba(255,94,44,0.12) 0%, rgba(255,42,95,0.08) 100%);
      
      /* Cores semânticas */
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.12);
      --info: #3b82f6;
      
      /* Superfícies */
      --bg-app: #fafbfc;
      --bg-mesh-1: rgba(255, 94, 44, 0.06);
      --bg-mesh-2: rgba(255, 42, 95, 0.04);
      --bg-mesh-3: rgba(59, 130, 246, 0.04);
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --surface-glass: rgba(255, 255, 255, 0.72);
      
      /* Texto */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-inverse: #ffffff;
      
      /* Bordas */
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-subtle: rgba(226, 232, 240, 0.6);
      
      /* Sombras em camadas */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07), 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-xl: 0 24px 48px rgba(15, 23, 42, 0.10), 0 8px 20px rgba(15, 23, 42, 0.05);
      --shadow-glow: 0 0 0 4px rgba(255, 94, 44, 0.12);
      
      /* Raios */
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --radius-full: 9999px;
      
      /* Transições */
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================================
       RESET
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      background-image: 
        radial-gradient(at 0% 0%, var(--bg-mesh-1) 0px, transparent 50%),
        radial-gradient(at 100% 0%, var(--bg-mesh-2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, var(--bg-mesh-3) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      letter-spacing: -0.011em;
    }

    /* ============================================================
       BARRA DE CONTROLE DE SOM
       ============================================================ */
    #sound-control-bar {
      background: linear-gradient(90deg, #7f1d1d 0%, #991b1b 100%);
      color: #fecaca;
      padding: 12px 25px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
      letter-spacing: 0.01em;
      transition: all var(--transition);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    
    #sound-control-bar::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.8s ease;
    }
    
    #sound-control-bar:hover::before { left: 100%; }
    #sound-control-bar:hover { filter: brightness(1.1); }
    #sound-control-bar:active { transform: scale(0.995); }

    @keyframes pulse-warning {
      0%, 100% { 
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      50% { 
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
      }
    }

    #sound-control-bar.warning {
      animation: pulse-warning 1.8s infinite;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    
    header::after {
      content: '';
      position: absolute;
      bottom: -60%; left: -5%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    header > div { position: relative; z-index: 1; }

    header h1 {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    header h1 i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.18);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      font-size: 1.1rem;
    }

    header p {
      margin: 6px 0 0 54px;
      font-size: 0.9rem;
      opacity: 0.88;
      font-weight: 400;
      letter-spacing: 0.005em;
    }

    /* ============================================================
       NAV TABS
       ============================================================ */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: var(--radius-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 1;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.95);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      letter-spacing: -0.005em;
    }

    .nav-tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      transform: scale(1.02);
    }
    
    .nav-tab-btn:not(.active):hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    /* ============================================================
       MAIN
       ============================================================ */
    main {
      padding: 32px 40px;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 1.7fr 1fr; gap: 28px; }
    .tab-content.full-width { display: none; grid-template-columns: 1fr; }
    .tab-content.full-width.active { display: block; }

    /* ============================================================
       TIPOGRAFIA
       ============================================================ */
    h2, h3 {
      font-family: 'Poppins', sans-serif;
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }
    
    h2 { font-size: 1.25rem; margin-bottom: 22px; }
    h3 { font-size: 1.05rem; margin-bottom: 18px; }
    
    h2 i, h3 i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px; height: 34px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 10px;
      font-size: 0.9rem;
    }

    /* ============================================================
       CARDS / SECTIONS
       ============================================================ */
    .queue-section,
    .qr-section,
    .add-person-form,
    .card-box {
      background: var(--surface);
      padding: 26px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
      border: 1px solid var(--border-subtle);
      transition: box-shadow var(--transition);
    }
    
    .queue-section:hover,
    .qr-section:hover,
    .add-person-form:hover,
    .card-box:hover {
      box-shadow: var(--shadow-lg);
    }

    /* ============================================================
       BOTÕES
       ============================================================ */
    .btn {
      background: var(--primary);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: -0.005em;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(255, 94, 44, 0.2);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }
    
    .btn:hover::before { width: 400px; height: 400px; }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 94, 44, 0.35);
    }
    
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-remove {
      background: var(--danger-soft);
      border: none;
      color: var(--danger);
      font-size: 1rem;
      width: 38px; height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    
    .btn-remove:hover {
      background: var(--danger);
      color: #ffffff;
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* ============================================================
       FILA / HISTÓRICO
       ============================================================ */
    .queue-actions { margin-bottom: 20px; }

    .queue-list, .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .queue-list li, .history-list li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 16px 18px;
      margin-bottom: 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-xs);
      transition: all var(--transition);
      position: relative;
      animation: slideIn 0.35s ease forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }
    
    .queue-list li:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
      border-left-color: var(--primary-dark);
    }
    
    .history-list li { border-left-color: var(--success); }

    .queue-list li.calling {
      animation: callingPulse 1s ease-in-out 2;
      border-left-color: var(--success) !important;
      background: linear-gradient(90deg, var(--success-soft) 0%, transparent 60%) !important;
    }
    
    @keyframes callingPulse {
      0%, 100% { transform: scale(1); box-shadow: var(--shadow-xs); }
      50% { transform: scale(1.02); box-shadow: 0 0 24px rgba(16, 185, 129, 0.35); }
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      animation: fadeIn 0.6s ease;
    }
    
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.4;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .empty-state p {
      margin: 0;
      font-weight: 500;
      font-size: 0.95rem;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============================================================
       PAGINAÇÃO
       ============================================================ */
    .pagination-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      min-width: 38px; height: 38px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    .page-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 94, 44, 0.3);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--surface-2);
    }

    /* ============================================================
       FORMULÁRIOS
       ============================================================ */
    form label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      letter-spacing: -0.005em;
    }
    
    form label i {
      color: var(--primary);
      font-size: 0.85rem;
    }

    form input, form select {
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 16px 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      appearance: none;
    }
    
    form input::placeholder { color: var(--text-muted); }
    
    form input:focus, form select:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: var(--shadow-glow);
    }
    
    form select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 40px;
      cursor: pointer;
    }

    /* ============================================================
       STAT CARDS
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    
    .stat-card {
      background: var(--surface);
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all var(--transition);
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: var(--primary-gradient);
    }
    
    .stat-card.success::before { background: var(--success); }
    .stat-card.warning::before { background: var(--warning); }
    
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    
    .stat-info h4 {
      margin: 0 0 8px 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    
    .stat-info span {
      font-family: 'Poppins', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    
    .stat-icon {
      font-size: 2.2rem;
      opacity: 0.15;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all var(--transition);
    }
    
    .stat-card:hover .stat-icon {
      opacity: 0.35;
      transform: scale(1.1) rotate(-5deg);
    }
    
    .stat-card.success .stat-icon {
      background: var(--success);
      -webkit-background-clip: text;
      background-clip: text;
    }
    
    .stat-card.warning .stat-icon {
      background: var(--warning);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* ============================================================
       QR CODE
       ============================================================ */
    .qr-section {
      text-align: center;
    }
    
    #qrcode-container {
      display: flex;
      justify-content: center;
      margin: 22px 0;
    }
    
    #qrcode {
      padding: 16px;
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      display: inline-flex;
      transition: transform var(--transition);
    }
    
    #qrcode:hover { transform: scale(1.03); }
    
    #qrcode canvas {
      display: block;
      border-radius: var(--radius-sm);
    }
    
    .qr-section > p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: #fff;
      padding: 14px 22px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xl);
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 9999;
      opacity: 0;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid var(--primary);
      max-width: 90%;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.warning-toast { border-left-color: var(--warning); background: #78350f; }
    #toast.error-toast { border-left-color: var(--danger); background: #7f1d1d; }
    #toast.success-toast { border-left-color: var(--success); background: #064e3b; }

    /* ============================================================
       RESPONSIVO
       ============================================================ */
    @media (max-width: 968px) {
      header {
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      
      header h1 { font-size: 1.4rem; }
      header h1 i { width: 38px; height: 38px; }
      header p { margin-left: 0; }
      
      .nav-tabs {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      main { padding: 20px; }
      
      .tab-content.active {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .queue-section, .qr-section, .add-person-form, .card-box {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      header { padding: 16px; }
      main { padding: 16px; }
      
      h2 { font-size: 1.1rem; }
      
      .stats-grid { grid-template-columns: 1fr; }
      
      .nav-tab-btn {
        padding: 8px 14px;
        font-size: 0.82rem;
      }
    }

    /* ============================================================
       DARK MODE
       ============================================================ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-app: #0a0f1a;
        --bg-mesh-1: rgba(255, 94, 44, 0.08);
        --bg-mesh-2: rgba(255, 42, 95, 0.05);
        --bg-mesh-3: rgba(59, 130, 246, 0.05);
        
        --surface: #131a2b;
        --surface-2: #0f1624;
        --surface-3: #1a2235;
        --surface-glass: rgba(19, 26, 43, 0.72);
        
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        
        --border: #1e293b;
        --border-strong: #334155;
        --border-subtle: rgba(30, 41, 59, 0.8);
        
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.65);
        
        --primary-soft: rgba(255, 94, 44, 0.15);
        --success-soft: rgba(16, 185, 129, 0.15);
        --danger-soft: rgba(239, 68, 68, 0.15);
      }
      
      form input, form select {
        background: var(--surface-2);
        color: var(--text-primary);
        border-color: var(--border-strong);
      }
      
      #qrcode {
        background: #ffffff;
      }
      
      .queue-list li.calling {
        background: linear-gradient(90deg, rgba(16, 185, 129, 0.15) 0%, transparent 60%) !important;
      }
    }
  </style>
</head>
<body>

  <div id="sound-control-bar" class="warning" role="button" tabindex="0" aria-label="Ativar alarme sonoro">
      <i id="sound-icon" class="fas fa-volume-mute" style="font-size: 1.2rem; color: #fca5a5;"></i> 
      <span id="sound-text">🔕 ALARME DESATIVADO — CLIQUE AQUI PARA ATIVAR</span>
  </div>

  <header>
    <div>
      <h1><i class="fas fa-store"></i> Lancheria</h1>
      <p>Gestão de atendimento e pedidos em tempo real</p>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab-btn active" onclick="switchTab('fila', event)"><i class="fas fa-list-ol"></i> Painel da Fila</button>
      <button class="nav-tab-btn" onclick="switchTab('historico', event)"><i class="fas fa-chart-line"></i> Histórico & Relatórios</button>
    </nav>
  </header>

  <main>
    <div id="tab-fila" class="tab-content active">
      <section class="queue-section" aria-live="polite">
        <h2><i class="fas fa-users"></i> Fila de Espera Atual</h2>
        <div class="queue-actions">
          <button id="call-next-btn" class="btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25); width: auto;">
            <i class="fas fa-bullhorn"></i> Chamar Próximo (WhatsApp)
          </button>
        </div>
        
        <ul id="queue-list" class="queue-list">
          <!-- Os itens entram dinamicamente via app.js -->
        </ul>
        
        <div id="empty-queue-message" class="empty-state">
          <i class="fas fa-mug-hot"></i>
          <p>A fila está vazia no momento.</p>
        </div>

        <!-- DIV DA PAGINAÇÃO -->
        <div id="pagination-controls" class="pagination-controls"></div>
      </section>
      
      <aside>
        <section class="qr-section">
          <h2 style="justify-content: center;"><i class="fas fa-qrcode"></i> QR Code do Cliente</h2>
          <div id="qrcode-container">
            <div id="qrcode"></div>
          </div>
          <p>Aponte a câmara para entrar na fila.</p>
        </section>

        <section class="add-person-form">
          <h3><i class="fas fa-user-plus"></i> Inserir Manualmente</h3>
          <form id="add-form">
            <label for="name"><i class="fas fa-user"></i> Nome do Cliente</label>
            <input type="text" id="name" placeholder="Ex: Maria Silva" required>
            
            <label for="whatsapp"><i class="fab fa-whatsapp" style="color: #25d366;"></i> WhatsApp</label>
            <input type="tel" id="whatsapp" placeholder="Ex: 53999887766" required>

            <label for="add-lanche"><i class="fas fa-hamburger"></i> Lanche</label>
            <select id="add-lanche" required>
                <option value="" disabled selected>Selecione o lanche...</option>
                <option value="X-Burger">🍔 X-Burger</option>
                <option value="X-Salada">🥗 X-Salada</option>
                <option value="X-Bacon">🥓 X-Bacon</option>
                <option value="X-Tudo">🍔 X-Tudo</option>
            </select>

            <label for="add-bebida"><i class="fas fa-cocktail"></i> Bebida</label>
            <select id="add-bebida" required>
                <option value="" disabled selected>Selecione a bebida...</option>
                <option value="Coca-Cola Lata

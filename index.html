<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff5e2c">
  <title>Painel Fila Virtual — Lancheria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --primary: #ff5e2c;
      --primary-dark: #e04b1f;
      --primary-light: #ffb199;
      --primary-soft: rgba(255, 94, 44, 0.08);
      --primary-gradient: linear-gradient(135deg, #ff5e2c 0%, #ff2a5f 100%);
      --primary-gradient-soft: linear-gradient(135deg, rgba(255,94,44,0.12) 0%, rgba(255,42,95,0.08) 100%);
      
      --success: #10b981;
      --success-dark: #059669;
      --success-soft: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.12);
      --info: #3b82f6;
      
      --bg-app: #fafbfc;
      --bg-mesh-1: rgba(255, 94, 44, 0.06);
      --bg-mesh-2: rgba(255, 42, 95, 0.04);
      --bg-mesh-3: rgba(59, 130, 246, 0.04);
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-subtle: rgba(226, 232, 240, 0.6);
      
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07), 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-xl: 0 24px 48px rgba(15, 23, 42, 0.10), 0 8px 20px rgba(15, 23, 42, 0.05);
      --shadow-glow: 0 0 0 4px rgba(255, 94, 44, 0.12);
      
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --radius-full: 9999px;
      
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Scrollbar customizada */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 10px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
      background-clip: padding-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      background-image: 
        radial-gradient(at 0% 0%, var(--bg-mesh-1) 0px, transparent 50%),
        radial-gradient(at 100% 0%, var(--bg-mesh-2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, var(--bg-mesh-3) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.011em;
    }

    /* ============================================================
       BARRA DE CONTROLE DE SOM — V2 (verde profundo + vermelho premium)
       ============================================================ */
    #sound-control-bar {
      background: linear-gradient(90deg, #7f1d1d 0%, #991b1b 100%);
      color: #fecaca;
      padding: 13px 25px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
      letter-spacing: 0.01em;
      transition: all var(--transition);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    
    #sound-control-bar::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.8s ease;
    }
    
    #sound-control-bar:hover::before { left: 100%; }
    #sound-control-bar:hover { filter: brightness(1.1); }
    #sound-control-bar:active { transform: scale(0.998); }

    /* Estado ATIVO: verde profundo elegante */
    #sound-control-bar:not(.warning) {
      background: linear-gradient(90deg, #064e3b 0%, #065f46 50%, #047857 100%);
      color: #a7f3d0;
    }
    #sound-control-bar:not(.warning) #sound-icon {
      color: #34d399 !important;
    }

    @keyframes pulse-warning {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    }

    #sound-control-bar.warning {
      animation: pulse-warning 1.8s infinite;
    }

    /* ============================================================
       HEADER — V2 (brilho radial duplo)
       ============================================================ */
    header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg), inset 0 -1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: -50%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
      pointer-events: none;
      animation: headerGlow 8s ease-in-out infinite alternate;
    }
    
    header::after {
      content: '';
      position: absolute;
      bottom: -60%; left: -5%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    
    @keyframes headerGlow {
      from { transform: translate(0, 0) scale(1); opacity: 0.8; }
      to { transform: translate(-30px, 30px) scale(1.15); opacity: 1; }
    }

    header > div { position: relative; z-index: 1; }

    header h1 {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    
    header h1 i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.22);
      border-radius: 13px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 1.1rem;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    header p {
      margin: 6px 0 0 56px;
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 400;
      letter-spacing: 0.005em;
    }

    /* ============================================================
       NAV TABS
       ============================================================ */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: var(--radius-md);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.22);
      position: relative;
      z-index: 1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.95);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      letter-spacing: -0.005em;
    }

    .nav-tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      transform: scale(1.02);
    }
    
    .nav-tab-btn:not(.active):hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    /* ============================================================
       MAIN
       ============================================================ */
    main {
      padding: 32px 40px;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content { display: none; }
    .tab-content.active { display: grid; grid-template-columns: 1.7fr 1fr; gap: 28px; }
    .tab-content.full-width { display: none; grid-template-columns: 1fr; }
    .tab-content.full-width.active { display: block; }

    /* ============================================================
       TIPOGRAFIA
       ============================================================ */
    h2, h3 {
      font-family: 'Poppins', sans-serif;
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }
    
    h2 { font-size: 1.25rem; margin-bottom: 22px; }
    h3 { font-size: 1.05rem; margin-bottom: 18px; }
    
    h2 i, h3 i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 11px;
      font-size: 0.9rem;
      transition: all var(--transition);
    }
    
    h2:hover i, h3:hover i {
      background: var(--primary);
      color: #fff;
      transform: rotate(-5deg) scale(1.05);
    }

    /* ============================================================
       CARDS / SECTIONS
       ============================================================ */
    .queue-section,
    .qr-section,
    .add-person-form,
    .card-box {
      background: var(--surface);
      padding: 26px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
      border: 1px solid var(--border-subtle);
      transition: box-shadow var(--transition);
      position: relative;
    }
    
    .queue-section:hover,
    .qr-section:hover,
    .add-person-form:hover,
    .card-box:hover {
      box-shadow: var(--shadow-lg);
    }

    /* ============================================================
       BOTÕES
       ============================================================ */
    .btn {
      background: var(--primary);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: -0.005em;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(255, 94, 44, 0.2);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }
    
    .btn:hover::before { width: 400px; height: 400px; }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 94, 44, 0.35);
    }
    
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ============================================================
       BOTÃO "CHAMAR PRÓXIMO" — V2 (com gradiente verde + glow)
       ============================================================ */
    #call-next-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35) !important;
      transition: all var(--transition) !important;
    }
    
    #call-next-btn:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5) !important;
      transform: translateY(-2px) !important;
    }
    
    #call-next-btn:active {
      transform: translateY(0) !important;
    }

    .btn-remove {
      background: var(--danger-soft);
      border: none;
      color: var(--danger);
      font-size: 1rem;
      width: 38px; height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    
    .btn-remove:hover {
      background: var(--danger);
      color: #ffffff;
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* ============================================================
       FILA / HISTÓRICO — V2 (com badge de posição circular)
       ============================================================ */
    .queue-actions { margin-bottom: 20px; }

    .queue-list, .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .queue-list li, .history-list li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 16px 18px;
      margin-bottom: 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-xs);
      transition: all var(--transition);
      position: relative;
      animation: slideIn 0.35s ease forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }
    
    .queue-list li:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
      border-left-color: var(--primary-dark);
    }
    
    .history-list li { border-left-color: var(--success); }

    /* V2: badge de posição circular gradiente */
    .queue-list li .person-position {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      background: var(--primary-gradient) !important;
      color: #fff !important;
      border-radius: 50% !important;
      font-family: 'Poppins', sans-serif !important;
      font-size: 0.95rem !important;
      font-weight: 700 !important;
      margin-right: 16px !important;
      min-width: 42px !important;
      box-shadow: 0 4px 10px rgba(255, 94, 44, 0.3);
      flex-shrink: 0;
    }

    /* V2: bloco do pedido com respiro à direita */
    .queue-list li .person-details > div:last-child {
      margin-right: 12px !important;
      max-width: calc(100% - 20px);
    }

    .queue-list li.calling {
      animation: callingPulse 1s ease-in-out 2;
      border-left-color: var(--success) !important;
      background: linear-gradient(90deg, var(--success-soft) 0%, transparent 60%) !important;
    }
    
    @keyframes callingPulse {
      0%, 100% { transform: scale(1); box-shadow: var(--shadow-xs); }
      50% { transform: scale(1.02); box-shadow: 0 0 24px rgba(16, 185, 129, 0.35); }
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      animation: fadeIn 0.6s ease;
    }
    
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.4;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .empty-state p {
      margin: 0;
      font-weight: 500;
      font-size: 0.95rem;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ============================================================
       PAGINAÇÃO
       ============================================================ */
    .pagination-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      min-width: 38px; height: 38px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    .page-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 94, 44, 0.3);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--surface-2);
    }

    /* ============================================================
       FORMULÁRIOS
       ============================================================ */
    form label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      letter-spacing: -0.005em;
    }
    
    form label i {
      color: var(--primary);
      font-size: 0.85rem;
    }

    form input, form select {
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 16px 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      appearance: none;
    }
    
    form input::placeholder { color: var(--text-muted); }
    
    form input:focus, form select:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: var(--shadow-glow);
    }
    
    form select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 40px;
      cursor: pointer;
    }

    /* ============================================================
       STAT CARDS — V2 (gradiente sutil no hover)
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    
    .stat-card {
      background: var(--surface);
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all var(--transition);
    }
    
    .stat-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--primary-gradient-soft);
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
    }
    
    .stat-card:hover::after { opacity: 1; }
    .stat-card.success:hover::after {
      background: linear-gradient(135deg, rgba(16,185,129,0.10) 0%, transparent 70%);
    }
    .stat-card.warning:hover::after {
      background: linear-gradient(135deg, rgba(245,158,11,0.10) 0%, transparent 70%);
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: var(--primary-gradient);
      z-index: 2;
    }
    
    .stat-card.success::before { background: var(--success); }
    .stat-card.warning::before { background: var(--warning); }
    
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    
    .stat-card > * { position: relative; z-index: 2; }
    
    .stat-info h4 {
      margin: 0 0 8px 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    
    .stat-info span {
      font-family: 'Poppins', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    
    .stat-icon {
      font-size: 2.2rem;
      opacity: 0.15;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all var(--transition);
    }
    
    .stat-card:hover .stat-icon {
      opacity: 0.4;
      transform: scale(1.15) rotate(-5deg);
    }
    
    .stat-card.success .stat-icon {
      background: var(--success);
      -webkit-background-clip: text;
      background-clip: text;
    }
    
    .stat-card.warning .stat-icon {
      background: var(--warning);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* ============================================================
       QR CODE — V2 (moldura gradiente animada)
       ============================================================ */
    .qr-section {
      text-align: center;
      position: relative;
    }
    
    #qrcode-container {
      display: flex;
      justify-content: center;
      margin: 22px 0;
      position: relative;
    }
    
    #qrcode-container::before {
      content: '';
      position: absolute;
      inset: -8px;
      background: var(--primary-gradient);
      border-radius: calc(var(--radius-md) + 8px);
      opacity: 0.15;
      filter: blur(20px);
      z-index: 0;
      animation: qrGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes qrGlow {
      from { opacity: 0.10; transform: scale(1); }
      to { opacity: 0.25; transform: scale(1.05); }
    }
    
    #qrcode {
      position: relative;
      z-index: 1;
      padding: 16px;
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      display: inline-flex;
      transition: transform var(--transition);
      border: 2px solid var(--border-subtle);
    }
    
    #qrcode:hover {
      transform: scale(1.04);
      border-color: var(--primary-light);
    }
    
    #qrcode canvas {
      display: block;
      border-radius: var(--radius-sm);
    }
    
    .qr-section > p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
      position: relative;
      z-index: 1;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: #fff;
      padding: 14px 22px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xl);
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 9999;
      opacity: 0;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid var(--primary);
      max-width: 90%;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.warning-toast { border-left-color: var(--warning); background: #78350f; }
    #toast.error-toast { border-left-color: var(--danger); background: #7f1d1d; }
    #toast.success-toast { border-left-color: var(--success); background: #064e3b; }

    /* ============================================================
       ACESSIBILIDADE — foco visível
       ============================================================ */
    *:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* ============================================================
       RESPONSIVO
       ============================================================ */
    @media (max-width: 968px) {
      header {
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      
      header h1 { font-size: 1.4rem; }
      header h1 i { width: 40px; height: 40px; }
      header p { margin-left: 0; }
      
      .nav-tabs {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      main { padding: 20px; }
      
      .tab-content.active {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .queue-section, .qr-section, .add-person-form, .card-box {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      header { padding: 16px; }
      main { padding: 16px; }
      
      h2 { font-size: 1.1rem; }
      
      .stats-grid { grid-template-columns: 1fr; }
      
      .nav-tab-btn {
        padding: 8px 14px;
        font-size: 0.82rem;
      }

      .queue-list li .person-position {
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
        font-size: 0.85rem !important;
      }
    }
